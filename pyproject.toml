[project]
name = "polypilot-mcp"
version = "0.1.0"
description = "Polypilot — MCP server for autonomous Polymarket trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.0",
]

[project.optional-dependencies]
# Polymarket CLOB V2 client. The legacy py-clob-client (v1) signs orders with the
# old EIP-712 domain version "1" and is rejected by production CLOB V2 with
# "invalid order version"; py-clob-client-v2 signs the V2 order struct.
trade = ["py-clob-client-v2>=1.0.1"]

[project.scripts]
polypilot-mcp = "polymarket_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_mcp"]

[dependency-groups]
dev = ["pytest>=8.0.0", "respx>=0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
